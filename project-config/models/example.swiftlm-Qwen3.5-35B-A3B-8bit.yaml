runtime: swiftlm
title: "Qwen3.5-35B-A3B (Speculative MoE - Multi-Project)"
provider: "openai"
binary: "storage/runtimes/swiftlm/bin/SwiftLM"
server:
  host: "127.0.0.1"
  port: 5425

swiftServerArgs:
  model: "mlx-community/Qwen3.5-35B-A3B-8bit"
  max-tokens: 4096 # Increased for large file refactors
  ctx-size: 65536  # Crucial for multi-project context on 256GB RAM
  temp: 0
