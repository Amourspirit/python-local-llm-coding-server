  # num-draft-tokens: 4 # High fidelity draft for complex logic
  api-key: ""
  turbo-kv: true   # Essential for 32k+ context management
  thinking: false  # Manual toggle only for architectural deep-dives[cite: 1]
  vision: false
  audio: false