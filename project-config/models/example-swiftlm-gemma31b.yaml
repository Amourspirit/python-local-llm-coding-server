runtime: swiftlm
title: "Gemma 4 31B (SwiftLM)"
provider: "openai"
binary: "storage/runtimes/swiftlm/bin/SwiftLM"
server:
  host: "127.0.0.1"
  port: 5423

swiftServerArgs:
  model: "mlx-community/gemma-4-31b-it-8bit"
  max-tokens: 2048
  ctx-size: ""
  temp: 0.7
  top-p: 1.0
  top-k: ""
  min-p: ""
  repeat-penalty: 1.0
  parallel: 1
  mem-limit: ""
  gpu-layers: "auto"
  prefill-size: 512
  draft-model: ""
  num-draft-tokens: ""
  api-key: ""
  turbo-kv: false
  thinking: false
  vision: false
  audio: false
