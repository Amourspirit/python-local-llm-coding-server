[project]
name = "python-local-llm-coding-serve"
version = "0.1.0"
description = "Local LLM profile manager for SwiftLM and MLX-VLM"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mlx-vlm>=0.1.15",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: Fast isolated unit tests",
    "integration: Integration tests with multiple modules",
]
